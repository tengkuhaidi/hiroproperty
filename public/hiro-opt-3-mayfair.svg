<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <!-- Transparent Background -->

  <!-- ICON (LEFT): Pure Line-Art Origami / Mayfair Crest -->
  <g transform="translate(65, 48)">
    <!-- Sharp Single Continuous Gable Stroke -->
    <path d="M 15 50 L 70 15 L 125 50 L 125 135 L 70 135 L 70 85 L 70 135 L 15 135 Z" 
          fill="none" stroke="#C59B27" stroke-width="3" stroke-linejoin="round" />

    <!-- Two Minimalist Solid Slits Forming the H Structure -->
    <rect x="36" y="52" width="10" height="70" rx="1.5" fill="#090E14" />
    <rect x="94" y="52" width="10" height="70" rx="1.5" fill="#090E14" />
    
    <!-- Floating Gold Horizontal Key Bar -->
    <line x1="46" y1="87" x2="94" y2="87" stroke="#C59B27" stroke-width="6" stroke-linecap="square" />
  </g>

  <!-- TYPOGRAPHY (RIGHT): High-Register Minimalist -->
  <g transform="translate(245, 140)">
    <text x="0" y="0" 
          font-family="'Playfair Display', Georgia, serif" 
          font-size="82" 
          font-weight="700" 
          letter-spacing="0.08em" 
          fill="#090E14">HIRO</text>

    <text x="280" y="-4" 
          font-family="'Inter', -apple-system, sans-serif" 
          font-size="64" 
          font-weight="300" 
          letter-spacing="0.22em" 
          fill="#64748B">PROPERTY</text>

    <!-- Subtitle -->
    <text x="284" y="32" 
          font-family="'Inter', sans-serif" 
          font-size="11" 
          font-weight="600" 
          letter-spacing="0.4em" 
          fill="#94A3B8">PRIVATE ESTATES &#183; JAKARTA &#183; BALI</text>
  </g>
</svg>
